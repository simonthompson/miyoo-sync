name: Build Miyoo Sync APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiyooSync-Release-APK
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Attach APK to GitHub Releases (If Tagged)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.buildozer.outputs.filename }}
          generate_release_notes: true
