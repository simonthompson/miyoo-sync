name: Build Miyoo Sync APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK with Buildozer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # NOTE: caching .buildozer here was tried and reverted — it broke a
      # working build. The SDK/NDK toolchain installs inside the container's
      # home directory (not the mounted workspace), so caching the
      # workspace-side .buildozer only captured per-arch build STATE, not
      # the toolchain itself. That state includes a marker p4a uses to skip
      # re-preparing the SDK — so a cached run skipped SDK setup while
      # still having zero Android platforms actually installed in the
      # fresh container, and failed immediately. Revisit with an explicit
      # extra volume mount for the container's home-dir SDK/NDK path if the
      # build time becomes a real problem again.
      # Uses the official Kivy Buildozer Docker image directly rather than
      # the ArtemSBulgakov/buildozer-action wrapper: that wrapper builds an
      # extra Docker layer on top of the official image which installs
      # OpenJDK from the openjdk-r PPA, and that PPA currently has no
      # packages for the Ubuntu release the wrapper's base image pulls in
      # (apt update 404s before Buildozer ever runs). The official image
      # already ships a working JDK, so this sidesteps the problem.
      - name: Build with Buildozer (official image)
        run: |
          yes | docker run --rm -i \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Locate built APK
        id: locate_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under bin/ — build likely failed upstream." >&2
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "filename=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiyooSync-Release-APK
          path: ${{ steps.locate_apk.outputs.filename }}

      - name: Attach APK to GitHub Releases (If Tagged)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.locate_apk.outputs.filename }}
          generate_release_notes: true
